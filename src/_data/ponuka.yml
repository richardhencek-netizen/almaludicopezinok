nadpis_nad: "Ponuka"
nadpis: "Od prvého uchopenia po prvú skupinku"
perex: "Lekcie sú rozdelené podľa veku, nie podľa toho, čo by dieťa „malo vedieť“. Každá skupina nadväzuje na predchádzajúcu."
programy:
  - vek: "4 – 12 mesiacov"
    nazov: "Lekcie s rodičom pre bábätká"
    popis: "Dieťa objavuje svet rukami a ústami. Na lekcii ste s ním — pedagóg ukazuje, čo môžete robiť aj doma."
    udaje:
      - polozka: "Kedy"
        hodnota: ""
      - polozka: "Dĺžka"
        hodnota: ""
      - polozka: "Cena"
        hodnota: ""
    tlacidlo: "Mám záujem"
    zvyraznit: false
  - vek: "1 – 2 roky"
    nazov: "Lekcie Alma Ludico pre batoľatá"
    popis: "Batoľa robí malé pokusy. Prelieva, vkladá, triedi a opakuje — a to opakovanie je presne to, čo pri učení potrebuje."
    udaje:
      - polozka: "Kedy"
        hodnota: ""
      - polozka: "Dĺžka"
        hodnota: ""
      - polozka: "Cena"
        hodnota: ""
    tlacidlo: "Mám záujem"
    zvyraznit: false
  - vek: "2 – 4 roky"
    nazov: "Alma Klub — moja prvá skupinka"
    popis: "Nie škôlka, nie opatrovanie. Klub, ktorý má každý týždeň inú tému. Dieťa si zvyká na kolektív, na to, že rodič odíde a vráti sa."
    udaje:
      - polozka: "Kedy"
        hodnota: "každý štvrtok 10:00"
      - polozka: "Dĺžka"
        hodnota: "90 min, bez rodiča"
      - polozka: "Skupina"
        hodnota: "max. 7 detí"
      - polozka: "Vstup"
        hodnota: "18 € jednorazovo"
    tlacidlo: "Prihlásiť dieťa"
    zvyraznit: true
