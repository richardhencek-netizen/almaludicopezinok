nadpis_nad: "Pre rodičov"
nadpis: "Otázky, ktoré si rodič kladie večer o desiatej"
perex: "Workshopy a besedy s odborníkmi. Krátke, konkrétne a s priestorom na vaše otázky."
podujatia:
  - typ: "Workshop"
    nazov: "Búrka v detskej izbe"
    popis: "Ako zvládnuť obdobie vzdoru — s Martinou Vagáčovou."
  - typ: "Beseda"
    nazov: "Čaj s homeopatkou"
    popis: "Kedy a komu vie homeopatia pomôcť — s Veronikou Nosalovou."
  - typ: "Seriál"
    nazov: "Čo sa deje v hlave dieťaťa?"
    popis: "Krátke texty o tom, prečo deti robia to, čo robia."
poznamka: "Aktuálne termíny zverejňujeme na Instagrame"
clanok:
  stitok: "Čo sa deje v hlave dieťaťa · 1. diel"
  nadpis: "Prečo deti opakujú stále tú istú hru?"
  perex: "To, čo vyzerá ako obyčajné opakovanie, je dôležitá súčasť učenia. Dieťa skúša, pozoruje a zisťuje, čo sa stane po jeho konaní."
  fotka: "/img/pomocky.webp"
  fotka_popis: "Rad drevených kociek od najmenšej po najväčšiu"
  body:
    - zvyraznene: "Bábätko"
      text: "uchopuje, otáča a pozoruje."
    - zvyraznene: "Batoľa"
      text: "skúša: čo keď predmet pustím? Vložím ho do nádoby?"
    - zvyraznene: "Vy"
      text: "nemusíte stále vymýšľať nové hry. Niekedy stačí pridať jeden nový predmet."
