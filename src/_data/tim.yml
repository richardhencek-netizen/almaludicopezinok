nadpis_nad: "O nás"
nadpis: "Štyri ženy a kopa nápadov"
perex: "Alma Ludico Pezinok je súčasťou siete centier Múdre hranie. Program je spoločný, ľudia sú naši."
ludia:
  - meno: "Karin"
    popis: "Vymýšľa, čím deťom zamotáme hlavu. Pripravuje obsah lekcií."
    fotka: ""
  - meno: "Bajka"
    popis: "Stará sa o to, aby sa deti pri učení aj poriadne rozhýbali."
    fotka: ""
  - meno: "Marta"
    popis: "Má na starosti tvorivosť — a občas aj kontrolovaný chaos."
    fotka: ""
  - meno: "Janka"
    popis: "Rieši rezervácie, vie, kde čo je, a drží centrum pohromade."
    fotka: ""
