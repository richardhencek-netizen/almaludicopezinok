nadpis_nad: "Program Alma Ludico"
nadpis: "Láskavá hra. Tak sa program volá — a tak aj funguje."
perex: "Meno je latinské. Nie je to škôlka, ktorá deti zabáva, ani inštitúcia, ktorá ich cvičí. Je to miesto, kde sa hra a učenie nedajú oddeliť."
vyznam_alma: "láskavá, vyživujúca, dávajúca — ako v slove alma mater"
vyznam_ludico: "hravá, od latinského ludus, hra"
podnadpis: "Čo dieťa na lekciách robí"
aktivity:
  - nazov: "Senzorické aktivity."
    text: "Uchopuje, trasie, prelieva, porovnáva. Prepája to, čo cíti, s vlastným pohybom."
  - nazov: "Práca pri stolíku."
    text: "Staršie deti sa učia sústrediť na jednu úlohu a dokončiť ju."
  - nazov: "Logické myslenie."
    text: "Pomôcky, pri ktorých dieťa skúša príčinu a následok — čo sa stane, keď predmet pustí, vloží, otočí."
  - nazov: "Emócie a reč."
    text: "Pomenovať, čo cíti. Logopedické hry pre prvé slová a vety."
citat: "„Montessori nie je metóda, ktorá deti tlačí dopredu. Je to spôsob, ako im nestáť v ceste.“"
citat_zdroj: "— z filozofie Alma Ludico"
