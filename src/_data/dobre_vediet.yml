nadpis_nad: "Dobré vedieť"
nadpis: "Než prídete prvýkrát"
polozky:
  - nazov: "Ukážková lekcia zdarma"
    text: "Prvú lekciu neplatíte. Uvidíte, ako to u nás vyzerá, a dieťa si priestor vyskúša."
  - nazov: "Prvé dni bývajú ťažké"
    text: "Plač pri lúčení je normálny. Ak to dieťa potrebuje, zostaňte s ním v miestnosti."
  - nazov: "Kočík a šatňa"
    text: "Sme na 1. poschodí. Kočík môžete nechať u nás — ukážeme vám kde."
  - nazov: "Darčekový poukaz"
    text: "Lekcie alebo klub ako darček k Vianociam či narodeninám. Napíšte nám."
