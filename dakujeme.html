<style>
/* Jost (SIL OFL) – lokálne */
@font-face{font-family:"Jost";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jost-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Jost";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Jost";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/jost-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

@font-face{font-family:"Jost";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/jost-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

/* ===== Farby podľa dizajn manuálu Alma Ludico ===== */
:root{
  --navy:#213164;      /* nosná, jediná farba na bežný text */
  --orange:#F6A700;    /* oblúk, semienko */
  --coral:#E25A50;     /* dieťa v hre */
  --sky:#6098EA;       /* vzpriamená postava */
  --green:#7FBA91;     /* najmenšie dieťa */
  --cream:#FEF1E2;     /* neutrál */
  /* stmavené verzie – iba text na bielom podklade */
  --coral-t:#CF4841; --sky-t:#3777C6; --green-t:#49815B; --orange-t:#A96700;
  --line:rgba(33,49,100,.14);
  --navy-70:rgba(33,49,100,.78);
  --radius:28px;
  --wrap:1180px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;font-family:"Jost",system-ui,sans-serif;font-weight:400;font-size:18px;line-height:1.55;color:var(--navy);background:#fff}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,5.4vw,4.1rem)}
h2{font-size:clamp(1.9rem,3.6vw,2.8rem)}
h3{font-size:1.3rem;line-height:1.25}
p{margin:0 0 1em}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.eyebrow{display:block;font-size:.78rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;margin-bottom:18px}
.lead{font-size:1.2rem;color:var(--navy-70);max-width:34em}
section{padding:110px 0}
.cream{background:var(--cream)}
.skip{position:absolute;left:-999px;top:8px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--sky-t);outline-offset:3px;border-radius:6px}

/* Tlačidlá */
.btn{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:500;font-size:1rem;text-decoration:none;border-radius:999px;padding:14px 26px;border:1.5px solid var(--navy);transition:transform .2s,background .2s,color .2s;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:#2c3f7c;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--navy)}
.btn-ghost:hover{background:var(--navy);color:#fff}
.btn-white{background:#fff;color:var(--navy);border-color:#fff}
.btn-white:hover{transform:translateY(-2px)}
.btn svg{width:18px;height:18px}

/* ===== Hlavička ===== */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;height:112px} /* ochranná zóna ½ X okolo loga */
.brand{display:block;width:170px;padding:6px 0}  /* min. 150 px na webe */
.brand img{width:100%;height:auto}
.menu{display:flex;align-items:center;gap:30px;list-style:none;margin:0;padding:0}
.menu a{text-decoration:none;font-weight:500;font-size:1rem;position:relative}
.menu a:not(.btn)::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.menu a:not(.btn):hover::after{transform:scaleX(1)}
.menu .btn{padding:11px 22px}
.burger{display:none;background:none;border:0;padding:10px;margin-right:-10px;cursor:pointer;color:var(--navy)}
.burger span{display:block;width:26px;height:2px;background:currentColor;border-radius:2px;margin:6px 0;transition:transform .25s,opacity .25s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

/* ===== Hero ===== */
.hero{padding:70px 0 110px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.hero h1 .accent{color:var(--coral-t)} /* koralová len vo veľkom nadpise na bielej */
.hero .lead{margin:28px 0 36px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:40px;font-size:.95rem;color:var(--navy-70)}
.hero-meta span{display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid;flex:none}
.hero-visual{position:relative}
.arch{border-radius:999px 999px var(--radius) var(--radius);overflow:hidden;aspect-ratio:4/4.6;background:var(--cream)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:35% center}
.hero-arc{position:absolute;left:-14%;top:-9%;width:72%;pointer-events:none}
.hero-arc path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.6s .3s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.badge{position:absolute;right:-12px;bottom:42px;background:#fff;border-radius:22px;padding:18px 22px;box-shadow:0 18px 40px -18px rgba(33,49,100,.35);display:flex;gap:14px;align-items:center;max-width:270px}
.badge strong{display:block;font-weight:600;font-size:1.02rem;line-height:1.25}
.badge small{font-size:.86rem;color:var(--navy-70)}
.badge .ring{width:44px;height:44px;flex:none}

/* Fakty */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{padding:30px 26px 30px 0;position:relative}
.fact+.fact{padding-left:26px;border-left:1px solid var(--line)}
.fact b{display:block;font-weight:600;font-size:1.9rem;line-height:1.1;margin-bottom:6px}
.fact span{font-size:.95rem;color:var(--navy-70)}
.fact::before{content:"";position:absolute;top:-1px;left:0;width:42px;height:3px;border-radius:3px;background:var(--c)}
.fact+.fact::before{left:26px}

/* ===== Program ===== */
.split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}
.name-card{background:#fff;border-radius:var(--radius);padding:40px;margin-top:36px}
.name-row{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
.name-row:last-child{border:0;padding-bottom:0}
.name-row:first-child{padding-top:0}
.name-row b{font-weight:600;font-size:1.25rem}
.name-row span{color:var(--navy-70)}
.checks{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:16px}
.checks li{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:start}
.checks svg{width:32px;height:32px;margin-top:-2px}
.quote{margin:44px 0 0;padding:28px 0 0;border-top:1px solid var(--line);font-size:1.3rem;font-weight:500;line-height:1.4}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:.9rem;font-weight:400;color:var(--navy-70)}

/* ===== Ponuka ===== */
.head{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-bottom:56px}
.head .lead{margin:0}
.path{position:relative}
.path-arc{position:absolute;left:4%;right:4%;top:-34px;height:60px;width:92%;pointer-events:none}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;position:relative}
.card{border:1.5px solid var(--line);border-radius:var(--radius);padding:34px 30px 30px;display:flex;flex-direction:column;background:#fff;transition:border-color .25s,transform .25s}
.card:hover{border-color:var(--c);transform:translateY(-4px)}
.card .icon{width:58px;height:58px;margin-bottom:26px}
.age{display:inline-block;font-size:.78rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ct);margin-bottom:10px}
.card h3{margin-bottom:14px}
.card p{color:var(--navy-70);font-size:1rem}
.specs{list-style:none;padding:18px 0 0;margin:auto 0 0;border-top:1px solid var(--line);display:grid;gap:8px;font-size:.95rem}
.specs li{display:flex;justify-content:space-between;gap:12px}
.specs li span:first-child{color:var(--navy-70)}
.specs li span:last-child{font-weight:500;text-align:right}
.tbd{color:var(--navy-70);font-style:italic;font-weight:400!important}
.card .btn{margin-top:24px;align-self:flex-start;padding:11px 22px;font-size:.95rem}

/* Galéria */
.gallery{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px;margin-top:80px}
.gallery figure{margin:0;border-radius:var(--radius);overflow:hidden;height:340px}
.gallery figure:first-child{border-radius:var(--radius) var(--radius) var(--radius) 170px}
.gallery figure:last-child{border-radius:999px 999px var(--radius) var(--radius)}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.gallery figure:hover img{transform:scale(1.04)}

/* ===== Rodičia ===== */
.events{display:grid;gap:0;margin-top:36px;border-top:1px solid var(--line)}
.event{display:grid;grid-template-columns:120px 1fr;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}
.event .kind{font-size:.78rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding-top:5px}
.event h3{font-size:1.15rem;margin-bottom:6px}
.event p{margin:0;color:var(--navy-70);font-size:1rem}
.article{background:#fff;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.article img{aspect-ratio:16/10;height:auto;object-fit:cover;width:100%}
.article-body{padding:34px 36px 38px}
.article h3{font-size:1.55rem;margin-bottom:14px}
.article p{color:var(--navy-70)}
.steps{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:14px;font-size:1rem}
.steps li::before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center;font-weight:600;font-size:.9rem}

/* Praktické */
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.info-item{padding:28px 0 0;border-top:3px solid var(--c)}
.info-item h3{font-size:1.12rem;margin-bottom:8px}
.info-item p{color:var(--navy-70);font-size:1rem;margin:0}

/* Tím */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:56px}
.person{text-align:left}
.avatar{width:96px;height:96px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-size:2rem;font-weight:600;margin-bottom:20px;position:relative}
.avatar::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--c);right:4px;bottom:6px}
.person h3{margin-bottom:6px}
.person p{color:var(--navy-70);font-size:1rem;margin:0}

/* ===== Kontakt ===== */
.contact{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.contact .eyebrow{color:#fff;opacity:.8}
.contact .lead{color:rgba(255,255,255,.82)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:start}
.contact-list{list-style:none;padding:0;margin:0;display:grid;gap:0;border-top:1px solid rgba(255,255,255,.18)}
.contact-list li{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.contact-list .k{font-size:.78rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:.75;padding-top:4px}
.contact-list a{text-decoration:none;font-size:1.15rem;font-weight:500}
.contact-list a:hover{text-decoration:underline;text-underline-offset:4px}
.contact-list .v{font-size:1.15rem}
.contact .hero-ctas{margin-top:36px}
.contact .btn-ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.contact .btn-ghost:hover{background:#fff;color:var(--navy)}
.contact-arc{position:absolute;right:-120px;bottom:-60px;width:520px;opacity:.9;pointer-events:none}
/* Formulár */
.form{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:var(--radius);padding:36px;display:grid;gap:16px;position:relative;z-index:1}
.form h3{font-size:1.4rem;margin-bottom:4px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:grid;gap:6px}
.field span{font-size:.85rem;font-weight:500;letter-spacing:.04em;opacity:.9}
.field input,.field select,.field textarea{font:inherit;font-size:1rem;color:var(--navy);background:#fff;border:2px solid transparent;border-radius:14px;padding:12px 14px;width:100%;transition:border-color .2s}
.field textarea{resize:vertical;min-height:90px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange)}
.check{display:grid;grid-template-columns:22px 1fr;gap:12px;font-size:.92rem;line-height:1.45;opacity:.92;align-items:start}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--orange)}
.form .btn{justify-self:start;margin-top:6px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{background:#1a2752;color:rgba(255,255,255,.75);padding:44px 0;font-size:.92rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.foot img{width:150px}
.foot a{text-decoration:none}
.foot a:hover{color:#fff}

/* Reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}

/* ===== Responzivita ===== */
@media (max-width:1020px){
  .hero-grid,.split,.contact-grid{grid-template-columns:1fr;gap:56px}
  .hero-visual{max-width:520px;margin:0 auto;width:100%}
  .facts{grid-template-columns:repeat(2,1fr)}
  .fact:nth-child(3){padding-left:0;border-left:0}
  .fact:nth-child(3)::before{left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--line)}
  .cards{grid-template-columns:1fr;max-width:620px}
  .path-arc{display:none}
  .info,.team{grid-template-columns:repeat(2,1fr);gap:40px 24px}
  .head{flex-direction:column;align-items:start;gap:20px}
}
@media (max-width:860px){
  .burger{display:block}
  .menu{position:fixed;inset:112px 0 auto 0;background:#fff;flex-direction:column;align-items:stretch;gap:0;padding:8px 24px 28px;border-bottom:1px solid var(--line);transform:translateY(-12px);opacity:0;visibility:hidden;transition:.25s;max-height:calc(100vh - 112px);overflow:auto}
  .menu.open{transform:none;opacity:1;visibility:visible}
  .menu li{border-bottom:1px solid var(--line)}
  .menu li:last-child{border:0;padding-top:20px}
  .menu a:not(.btn){display:block;padding:16px 0;font-size:1.15rem}
  .menu a:not(.btn)::after{display:none}
  .menu .btn{width:100%;justify-content:center;padding:15px}
}
@media (max-width:640px){
  body{font-size:17px}
  section{padding:76px 0}
  .wrap{padding:0 20px}
  .nav{height:100px}
  .menu{inset:100px 0 auto 0;max-height:calc(100vh - 100px)}
  .brand{width:150px}
  .hero{padding:36px 0 76px}
  .hero-ctas .btn{width:100%;justify-content:center}
  .badge{position:relative;right:auto;bottom:auto;margin:-48px 16px 0;max-width:none}
  .hero-arc{left:-6%;top:-6%}
  .facts{grid-template-columns:1fr 1fr}
  .fact{padding:22px 14px 22px 0}
  .fact+.fact{padding-left:14px}
  .fact:nth-child(3){padding-left:0}
  .fact+.fact::before{left:14px}
  .fact:nth-child(3)::before{left:0}
  .fact b{font-size:1.35rem}
  .name-card,.article-body{padding:28px 24px}
  .name-row{grid-template-columns:1fr;gap:4px}
  .gallery{grid-template-columns:1fr 1fr;margin-top:56px;gap:12px}
  .gallery figure{height:200px}
  .gallery figure:first-child{grid-column:1/-1;height:240px}
  .event{grid-template-columns:1fr;gap:6px}
  .info,.team{grid-template-columns:1fr}
  .team{gap:36px}
  .person{display:grid;grid-template-columns:80px 1fr;gap:20px;align-items:center}
  .avatar{width:80px;height:80px;margin:0;font-size:1.7rem}
  .contact-list li{grid-template-columns:1fr;gap:4px}
  .form{padding:26px 20px}
  .form .row{grid-template-columns:1fr}
  .form .btn{width:100%;justify-content:center}
  .contact-arc{width:340px;right:-140px}
  .foot{flex-direction:column;align-items:flex-start}
}
</style>
<style>.thanks{min-height:calc(100vh - 112px);display:grid;place-items:center;text-align:center;padding:60px 0;background:var(--cream)}.thanks .wrap{max-width:640px}.thanks svg.ring{width:84px;height:84px;margin:0 auto 32px}.thanks .lead{margin:24px auto 36px}</style>

<body>
